{% extends "base.html" %}
{% block content %}
<section class="page-section">
  <h1>Review Station</h1>
  <p>Manual approval queue for campaign content.</p>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Platform</th>
        <th>Caption</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for post in posts %}
      <tr>
        <td>{{ post[0] }}</td>
        <td>{{ post[2] }}</td>
        <td>{{ post[3] }}</td>
        <td>{{ post[5] }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4">No content waiting for review.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
